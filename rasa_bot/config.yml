recipe: default.v1

assistant_id: ai_career_counsellor

language: en

pipeline:
- name: WhitespaceTokenizer

- name: RegexFeaturizer

- name: LexicalSyntacticFeaturizer

- name: CountVectorsFeaturizer

- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 3
  max_ngram: 5

- name: DIETClassifier
  epochs: 100

- name: EntitySynonymMapper

- name: ResponseSelector
  epochs: 100

- name: FallbackClassifier
  threshold: 0.30

policies:
- name: MemoizationPolicy

- name: RulePolicy

- name: TEDPolicy
  epochs: 100
